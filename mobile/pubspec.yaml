name: adaptive_cbc_mobile
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  provider: ^6.1.5+1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  socket_io_client: ^3.1.6
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  livekit_client: ^2.3.1+hotfix.1
  permission_handler: ^12.0.3
  flutter_markdown: ^0.7.7+1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  connectivity_plus: ^6.1.5
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1
  firebase_auth: ^6.5.2
  sign_in_with_apple: ^8.1.0
  shared_preferences: ^2.5.5
  better_player_plus: ^1.3.3
  url_launcher: ^6.3.2
  google_sign_in: 6.2.1
  signature: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.png"
  android: true
  ios: true
