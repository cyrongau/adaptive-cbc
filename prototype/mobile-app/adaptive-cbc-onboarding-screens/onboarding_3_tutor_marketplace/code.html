<style>

<body class="flex flex-col min-h-screen text-on-surface overflow-hidden">
<!-- Top Navigation Suppression: Not shown on onboarding per guidelines -->
<main class="flex-grow flex flex-col items-center justify-between px-margin-mobile pt-stack-lg pb-stack-lg relative">
<!-- Background Atmosphere -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">

</div>
<!-- Top Content Cluster: Skip & Header -->

<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors py-base px-stack-sm active:scale-95 duration-200">

</div>
<!-- Central Illustration Section -->
<div class="w-full max-w-sm flex-grow flex flex-col justify-center items-center z-10 py-stack-lg">
<div class="illustration-container w-full aspect-square relative flex items-center justify-center">
<!-- Decorative elements behind image -->
<div class="absolute inset-0 bg-secondary-container/20 rounded-full scale-90 floating-accent"></div>

<span class="material-symbols-outlined text-primary text-[20px]">verified</span>
<span class="font-label-sm text-label-sm">Expert Tutors</span>
</div>
<div class="absolute bottom-10 left-4 bg-white p-stack-sm rounded-xl onboarding-card flex items-center gap-2 floating-accent" style="animation-delay: -2.5s;">

<span class="font-label-sm text-label-sm">Live 1-on-1</span>
</div>
</div>
</div>

<!-- Typography Section -->

                    Learn from the Best

                    Connect with expert tutors for live 1-on-1 lessons tailored to your specific needs and curriculum goals.
                </p>
</div>

<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>

<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

<!-- Bottom Navigation Suppression: Not shown on onboarding per guidelines -->
<script>
        // Micro-interaction: Button hover/active visual feedback
        const nextBtn = document.querySelector('button');
        nextBtn.addEventListener('touchstart', () => {
            nextBtn.classList.add('brightness-90');
        });
        nextBtn.addEventListener('touchend', () => {
            nextBtn.classList.remove('brightness-90');
        });

        // Background parallax-ish movement on device tilt (if supported) or mouse move
        const atmosphere = document.querySelector('.absolute.inset-0.z-0');
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            atmosphere.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
        });
    </script>
