<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Nunito Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: minmax(100px, auto);
            gap: 12px;
        }
        .shelf-gradient {
            background: linear-gradient(180deg, #f0edec 0%, #ffffff 100%);
        }
        .blob-animation {
            animation: blob-float 15s infinite alternate ease-in-out;
        }
        @keyframes blob-float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface overflow-hidden">
<!-- Header (Suppressed BottomNav & SideNav per Destination Rule for Onboarding) -->
<header class="fixed top-0 left-0 w-full z-40 px-margin-mobile py-stack-md flex justify-between items-center bg-transparent">
<span class="font-headline-md text-headline-md-mobile font-extrabold text-primary">Lumina CBC</span>
<button class="text-label-lg font-label-lg text-tertiary px-base py-base hover:bg-surface-container-low transition-colors rounded-lg">Skip</button>
</header>
<main class="relative flex flex-col h-screen w-full pt-20 pb-safe px-margin-mobile overflow-hidden">
<!-- Background Atmospheric Element -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-secondary-fixed opacity-20 blur-3xl rounded-full blob-animation"></div>
<!-- Illustration Canvas (Bento-inspired asymmetric layout for visual interest) -->
<div class="relative flex-1 flex flex-col justify-center items-center">
<div class="w-full max-w-sm aspect-square relative mb-stack-lg">
<!-- Central Focus: The Digital Shelf Illustration -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-full h-full rounded-3xl overflow-hidden shadow-lg border border-outline-variant bg-surface-container-lowest flex flex-col p-4">
<div class="flex items-center gap-2 mb-4 border-b border-outline-variant pb-2">
<span class="material-symbols-outlined text-primary">auto_stories</span>
<span class="font-label-lg text-label-lg text-on-surface">Digital Archive</span>
</div>
<!-- Asymmetric Bento Display of Folders/Documents -->
<div class="grid grid-cols-6 grid-rows-4 gap-3 flex-1">
<div class="col-span-3 row-span-2 bg-secondary-container rounded-xl p-3 flex flex-col justify-between shadow-sm border border-secondary-fixed-dim">
<span class="material-symbols-outlined text-secondary text-3xl">folder</span>
<span class="text-label-sm font-label-sm text-on-secondary-container">Past Papers</span>
</div>
<div class="col-span-3 row-span-1 bg-surface-container-high rounded-xl p-2 flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary">description</span>
<span class="text-[10px] font-bold text-tertiary uppercase tracking-wider">Exam Kit</span>
</div>
<div class="col-span-3 row-span-1 bg-tertiary-fixed rounded-xl p-2 flex items-center gap-2">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant">checklist</span>
<span class="text-[10px] font-bold text-on-tertiary-fixed-variant uppercase tracking-wider">Answers</span>
</div>
<div class="col-span-2 row-span-2 bg-primary-container/10 rounded-xl border-2 border-dashed border-primary/20 flex flex-col items-center justify-center gap-1">
<span class="material-symbols-outlined text-primary">add_circle</span>
<span class="text-[8px] font-bold text-primary">Grade 9</span>
</div>
<div class="col-span-4 row-span-2 bg-white rounded-xl shadow-sm border border-outline-variant p-3 flex flex-col">
<div class="w-full h-2 bg-surface-container rounded-full mb-2"></div>
<div class="w-2/3 h-2 bg-surface-container rounded-full mb-4"></div>
<div class="mt-auto flex justify-between items-center">
<div class="flex -space-x-2">
<div class="w-6 h-6 rounded-full bg-secondary-fixed border-2 border-white"></div>
<div class="w-6 h-6 rounded-full bg-primary-fixed border-2 border-white"></div>
</div>
<span class="material-symbols-outlined text-secondary text-lg">star</span>
</div>
</div>
</div>
</div>
</div>
<!-- Floating Accents -->
<div class="absolute -bottom-4 -left-4 w-20 h-20 bg-primary-fixed rounded-2xl rotate-12 -z-10 opacity-40"></div>
<div class="absolute -top-6 -right-2 w-16 h-16 bg-secondary-fixed rounded-full -z-10 opacity-30"></div>
</div>
</div>
<!-- Content Section -->
<div class="flex flex-col mb-stack-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm text-center">
                A World of Knowledge at Your Fingertips
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-4">
                Access thousands of verified past papers, mock exams, and revision kits for Grade 1 through 9.
            </p>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-stack-md mt-auto pb-stack-lg">
<!-- Progress Indicator -->
<div class="flex justify-center items-center gap-2 mb-stack-sm">
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-8 h-2 rounded-full bg-primary transition-all duration-500"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Main Button -->
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 group" onclick="window.location.reload()">
                Next
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</main>
<!-- Visual Polish: Decorative blurred elements -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-screen h-1/3 bg-gradient-to-t from-background to-transparent pointer-events-none -z-10"></div>
<script>
        // Micro-interaction for the Bento Cards
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.grid > div');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index + 300);
            });
        });
    </script>
</body></html>
