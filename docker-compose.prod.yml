services:
  # ============================================================
  # PostgreSQL — Host port 5434 (5432, 5433 taken)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: adaptive-learning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cbc_user
      POSTGRES_PASSWORD: cbc_secure_pass_2024
      POSTGRES_DB: adaptive_cbc
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbc_user"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - adaptive-network

  # ============================================================
  # Redis — Host port 6382 (6380, 6381 taken)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: adaptive-learning-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - adaptive-network

  # ============================================================
  # MinIO — Host ports 9003 (API), 9004 (Console)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: adaptive-learning-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9003:9000"
      - "9004:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - adaptive-network

  # ============================================================
  # Backend (NestJS) — Host port 3002
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: adaptive-learning-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=cbc_user
      - DATABASE_PASSWORD=cbc_secure_pass_2024
      - DATABASE_NAME=adaptive_cbc
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=adaptive-cbc-files
      - MINIO_PUBLIC_ENDPOINT=157.173.123.156:9003
      - AI_SERVICE_URL=http://ai-service:8002
      - OCR_SERVICE_URL=http://ocr-service:8003
      - FRONTEND_URL=https://adaptivecbc.co.ke
      - CORS_ORIGIN=https://adaptivecbc.co.ke,https://api.adaptivecbc.co.ke
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/credentials:/app/credentials:ro
    networks:
      - adaptive-network

  # ============================================================
  # Frontend (Next.js) — Host port 3003
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: adaptive-learning-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
    ports:
      - "3003:3000"
    depends_on:
      - backend
    networks:
      - adaptive-network

  # ============================================================
  # AI Service — Host port 8002
  # ============================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
    container_name: adaptive-learning-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env.production
    environment:
      - PORT=8002
      - NODE_ENV=production
    ports:
      - "8002:8002"
    networks:
      - adaptive-network

  # ============================================================
  # OCR Service — Host port 8003
  # ============================================================
  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: adaptive-learning-ocr-service
    restart: unless-stopped
    env_file:
      - ./services/ocr-service/.env.production
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=ocr-documents
      - MINIO_SECURE=false
    ports:
      - "8003:8003"
    volumes:
      - ./backend/credentials:/app/credentials:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - adaptive-network

  # ============================================================
  # Nginx (internal reverse proxy) — Host port 8100
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: adaptive-learning-nginx
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - adaptive-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  adaptive-network:
    driver: bridge
